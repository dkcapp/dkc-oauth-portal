<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DKC Portal - ระบบจัดการองค์กร</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">
    <nav class="navbar">
        <div class="navbar-left">
            <button id="sidebarToggle" class="btn-icon mobile-only">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <svg class="nav-logo" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
            <span class="nav-title">DKC Portal</span>
        </div>
        <div class="navbar-right">
            <div class="user-profile">
                <span id="navDisplayName">กำลังโหลด...</span>
                <svg class="avatar" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <button id="logoutBtn" class="btn-icon text-danger" title="ออกจากระบบ">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
    </nav>

    <div class="layout-container">
        <aside class="sidebar" id="sidebar">
            <ul class="nav-menu">
                <li>
                    <a href="#" class="nav-item active" data-section="profile">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        หน้าหลัก
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item" data-section="message">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        ส่งข้อความ
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item" data-section="approval">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14l2 2 4-4"></path></svg>
                        ขออนุมัติ
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <!-- Profile Section -->
            <section id="profile" class="content-section active">
                <h2 class="section-title">ข้อมูลส่วนตัว</h2>
                <div class="card profile-card">
                    <div class="card-body">
                        <div class="profile-header">
                            <div class="profile-info">
                                <h3 id="profileName">กำลังโหลด...</h3>
                                <p class="text-muted" id="profileUsername">-</p>
                                <p class="text-muted" id="profileEmail">-</p>
                                <p class="text-muted" id="profileLine"></p>
                            </div>
                        </div>
                        <h4 class="mt-4">ข้อมูลหน่วยงาน</h4>
                        <div id="officesContainer" class="offices-grid">
                            <!-- Office cards will be generated here -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Message Section -->
            <section id="message" class="content-section" style="display: none;">
                <h2 class="section-title">ส่งข้อความ</h2>
                <div class="card">
                    <div class="card-body">
                        <form id="messageForm">
                            <div class="form-group">
                                <label>ช่องทางการส่ง</label>
                                <div class="checkbox-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="channels" value="email">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                        Email
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="channels" value="line">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                        LINE
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="channels" value="hr_mobile">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                                        HR Mobile
                                    </label>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>ประเภทผู้รับ</label>
                                <div class="radio-group">
                                    <label class="radio-label">
                                        <input type="radio" name="recipientType" value="toAd" checked>
                                        AD Username
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="recipientType" value="to">
                                        Email
                                    </label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="recipients">ผู้รับ (คั่นด้วยเครื่องหมายจุลภาค ,)</label>
                                <input type="text" id="recipients" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="msgSubject">หัวข้อ</label>
                                <input type="text" id="msgSubject" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="msgText">ข้อความ</label>
                                <textarea id="msgText" class="form-control" rows="4" required></textarea>
                            </div>

                            <div class="form-group" id="emailBodyGroup" style="display: none;">
                                <label for="emailBody">ข้อความอีเมล (HTML)</label>
                                <textarea id="emailBody" class="form-control" rows="6"></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                ส่งข้อความ
                            </button>
                        </form>
                    </div>
                </div>
                
                <div id="messageResult" class="card mt-4" style="display: none;">
                    <div class="card-body">
                        <h3>ผลการส่งข้อความ</h3>
                        <div id="messageResultContent"></div>
                    </div>
                </div>
            </section>

            <!-- Approval Section -->
            <section id="approval" class="content-section" style="display: none;">
                <h2 class="section-title">ระบบขออนุมัติ</h2>
                
                <div class="card mb-4">
                    <div class="card-body">
                        <h3 class="card-title">ส่งคำขออนุมัติ</h3>
                        <form id="approvalForm">
                            <div class="form-group">
                                <label for="extRefId">รหัสอ้างอิง (ExternalRefID)</label>
                                <input type="text" id="extRefId" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label>ประเภทการอนุมัติ</label>
                                <div class="radio-group vertical">
                                    <label class="radio-label">
                                        <input type="radio" name="approveType" value="1" checked>
                                        1 - หัวหน้ากองเท่านั้น
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="approveType" value="2">
                                        2 - หัวหน้ากอง + หัวหน้าสำนัก
                                    </label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="apprSubject">หัวข้อ</label>
                                <input type="text" id="apprSubject" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="msgForHead">ข้อความถึงหัวหน้า</label>
                                <textarea id="msgForHead" class="form-control" rows="3" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">ส่งคำขอ</button>
                        </form>
                    </div>
                </div>
                
                <div id="approvalResult" class="card mb-4" style="display: none;">
                    <div class="card-body">
                        <h3>ผลการส่งคำขอ</h3>
                        <div id="approvalResultContent"></div>
                    </div>
                </div>

                <hr class="separator">

                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title">ตรวจสอบสถานะการอนุมัติ</h3>
                        <form id="checkStatusForm" class="flex-form">
                            <div class="form-group mb-0 flex-grow">
                                <label for="checkExtRefId" class="sr-only">รหัสอ้างอิง</label>
                                <input type="text" id="checkExtRefId" class="form-control" placeholder="ระบุรหัสอ้างอิง..." required>
                            </div>
                            <button type="submit" class="btn btn-secondary">ตรวจสอบ</button>
                        </form>
                        
                        <div id="statusResult" class="mt-4" style="display: none;">
                            <!-- Status result will go here -->
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="icons/icons.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/message.js"></script>
    <script src="js/approval.js"></script>
    <script>
        // Simple mock of app.js behavior for UI flow
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                
                const section = item.dataset.section;
                document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
                document.getElementById(section).style.display = 'block';
            });
        });
        
        document.getElementById('sidebarToggle')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
        });
        
        // Show/hide email body based on channel
        const emailCheckbox = document.querySelector('input[name="channels"][value="email"]');
        if (emailCheckbox) {
            emailCheckbox.addEventListener('change', (e) => {
                document.getElementById('emailBodyGroup').style.display = e.target.checked ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
